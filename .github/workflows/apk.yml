# بيبني تطبيق أندرويد (APK) تلقائي مع كل تحديث، وبينشره في Releases
name: Build APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'css/**', 'js/**', 'fonts/**', 'icons/**', 'android-app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # كل خطوة بتكتب سجلها، ولو فشلت بتطلع آخره كـ annotation علشان السبب يبان من غير فتح الـ logs
      - name: Install Capacitor
        working-directory: android-app
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" ; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -6
          npm install --no-audit --no-fund 2>&1 | tee ../step.log || { echo "::error title=npm install::$(tail -c 1500 ../step.log | tr '\n' ' ')"; exit 1; }

      - name: Prepare web files
        working-directory: android-app
        run: python3 prepare.py web

      - name: Create Android project
        working-directory: android-app
        run: |
          set -o pipefail
          { npx cap add android && python3 prepare.py android && npx cap sync android; } 2>&1 | tee ../step.log || { echo "::error title=cap add android::$(tail -c 1500 ../step.log | tr '\n' ' ')"; exit 1; }

      - name: Build
        working-directory: android-app/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../../step.log || { echo "::error title=gradle::$(grep -E 'error:|FAILURE|What went wrong|> ' ../../step.log | tail -25 | tr '\n' ' ' | cut -c1-3000)"; exit 1; }

      - name: Sign
        if: success()
        working-directory: android-app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error title=مفتاح التوقيع ناقص::أضف ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD في Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$IN" aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias hesasy --ks-pass env:KS_PW --key-pass env:KS_PW --out hesasy.apk aligned.apk
          $BT/apksigner verify hesasy.apk
          rm -f "$RUNNER_TEMP/release.jks"
          echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION }}-${{ github.run_number }}
          name: حصصي ${{ env.VERSION }} (بناء ${{ github.run_number }})
          body: |
            نزّل `hesasy.apk` وثبّته على الموبايل. لو التطبيق متثبت قبل كده، ثبّت فوقه — البيانات بتفضل زي ما هي.
            رابط ثابت لآخر إصدار: https://github.com/${{ github.repository }}/releases/latest/download/hesasy.apk
          files: android-app/hesasy.apk
          make_latest: true
